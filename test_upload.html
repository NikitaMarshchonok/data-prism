<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1a1a1a; color: white; }
        .form-group { margin: 20px 0; }
        input, textarea, button { padding: 10px; margin: 5px; border-radius: 5px; }
        input[type="file"] { background: #333; color: white; border: 1px solid #555; }
        textarea { width: 100%; background: #333; color: white; border: 1px solid #555; }
        button { background: #0066cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #0052a3; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .info { background: #2d4a5a; }
    </style>
</head>
<body>
    <h1>🔧 VibeDash Upload Test</h1>
    
    <div id="status" class="status info">
        Ready to test file upload...
    </div>
    
    <form id="testForm" method="POST" action="http://localhost:5001/vibedash/preview" enctype="multipart/form-data">
        <div class="form-group">
            <label for="datafile">📁 Select CSV File:</label><br>
            <input type="file" id="datafile" name="datafile" accept=".csv" required>
            <div id="fileInfo"></div>
        </div>
        
        <div class="form-group">
            <label for="prompt">💭 Describe what you want:</label><br>
            <textarea id="prompt" name="prompt" rows="3" required 
                      placeholder="Create a sales dashboard with KPIs and charts">Create a sales dashboard with main KPIs, top categories, and trends</textarea>
        </div>
        
        <div class="form-group">
            <button type="submit" id="submitBtn">🚀 Test Upload</button>
        </div>
    </form>
    
    <div id="debug" style="margin-top: 20px; padding: 10px; background: #333; border-radius: 5px; font-family: monospace; font-size: 12px;">
        <strong>Debug Info:</strong><br>
        <div id="debugContent">Waiting for form interaction...</div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const fileInput = document.getElementById('datafile');
        const promptInput = document.getElementById('prompt');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debugContent');
        
        function updateStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function addDebug(message) {
            debugDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
        }
        
        // File selection handler
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                addDebug(`File selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);
                document.getElementById('fileInfo').innerHTML = 
                    `<div style="color: #4ade80; margin-top: 5px;">✅ Selected: ${file.name}</div>`;
                updateStatus(`File selected: ${file.name}`, 'success');
            } else {
                addDebug('No file selected');
                document.getElementById('fileInfo').innerHTML = '';
                updateStatus('No file selected', 'error');
            }
        });
        
        // Form submission handler
        form.addEventListener('submit', function(e) {
            addDebug('Form submit event triggered');
            
            if (fileInput.files.length === 0) {
                e.preventDefault();
                addDebug('❌ No file selected - preventing submit');
                updateStatus('Please select a file first!', 'error');
                return false;
            }
            
            if (!promptInput.value.trim()) {
                e.preventDefault();
                addDebug('❌ No prompt provided - preventing submit');
                updateStatus('Please provide a description!', 'error');
                return false;
            }
            
            addDebug('✅ Form validation passed - submitting...');
            updateStatus('Uploading file...', 'info');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Uploading...';
            
            // Show what we're sending
            const formData = new FormData(form);
            addDebug(`Sending to: ${form.action}`);
            addDebug(`File: ${fileInput.files[0].name}`);
            addDebug(`Prompt: ${promptInput.value.substring(0, 50)}...`);
        });
        
        // Initial debug info
        addDebug('Page loaded');
        addDebug(`Form action: ${form.action}`);
        addDebug(`Form method: ${form.method}`);
        addDebug(`Form enctype: ${form.enctype}`);
    </script>
</body>
</html>
