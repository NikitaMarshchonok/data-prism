name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      FLASK_SECRET_KEY: ci-session-key-that-is-long-enough-for-tests
      DATA_PRISM_API_KEY: ci-monitoring-key-that-is-long-enough-for-tests
      MPLCONFIGDIR: /tmp/data-prism-matplotlib
      XDG_CACHE_HOME: /tmp/data-prism-cache
      PYTHONDONTWRITEBYTECODE: "1"
      LOG_LEVEL: WARNING

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py web_app.py monitor_drift.py src vibedash

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run VibeDash smoke tests
        run: python test_vibedash.py

  container:
    name: Container smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag data-prism:ci .

      - name: Start production container
        run: |
          docker run --detach --name data-prism-ci \
            --env FLASK_SECRET_KEY=ci-container-session-key-that-is-long-enough \
            --env DATA_PRISM_API_KEY=ci-container-monitoring-key-that-is-long-enough \
            --env SERVICE_VERSION=ci-container \
            --publish 5001:5001 \
            data-prism:ci

      - name: Verify readiness and request correlation
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5001/readyz > /tmp/data-prism-ready.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs data-prism-ci
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            --dump-header /tmp/data-prism-response-headers \
            --header "X-Request-ID: ci-health-check" \
            http://127.0.0.1:5001/healthz > /tmp/data-prism-health.json

          grep --ignore-case --quiet \
            '^x-request-id: ci-health-check' \
            /tmp/data-prism-response-headers
          grep --quiet '"status":"ready"' /tmp/data-prism-ready.json
          grep --quiet '"version":"ci-container"' /tmp/data-prism-health.json
          docker logs data-prism-ci > /tmp/data-prism-container.log 2>&1
          grep --quiet '"event":"http_request"' /tmp/data-prism-container.log

      - name: Stop production container
        if: always()
        run: docker rm --force data-prism-ci
